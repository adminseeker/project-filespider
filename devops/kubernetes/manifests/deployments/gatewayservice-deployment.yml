apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayservice
  namespace: project-filespider
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatewayservice
  template:
    metadata:
      labels:
        app: gatewayservice
    spec:
      serviceAccountName: sc-k8s-sa
      containers:
        - name: gatewayservice
          image: ghcr.io/adminseeker/filespider-gatewayservice:latest
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          ports:
          - containerPort: 8090
      imagePullSecrets:
        - name:  container-registry-secret
