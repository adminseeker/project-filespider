apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-aravindweb-com
  namespace: project-filespider
spec:
  secretName: wildcard-k8s-aravindweb-com-tls
  issuerRef:
    name: letsencrypt-wildcard
    kind: ClusterIssuer
  commonName: "*.k8s.aravindweb.com"
  dnsNames:
  - "*.k8s.aravindweb.com"
  