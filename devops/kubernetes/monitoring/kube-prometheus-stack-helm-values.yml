# kube-prometheus-values.yaml

# Prometheus: enable storage via storageSpec
prometheus:
  enabled: true
  prometheusSpec:
    retention: "7d"                       # adjust to your needs (e.g. "30d")
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "longhorn"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Alertmanager: persistent storage for alerts
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "longhorn"
          resources:
            requests:
              storage: 1Gi

# Grafana persistence
grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: "longhorn"
    accessModes: ["ReadWriteOnce"]
    size: 2Gi

# (Optional) kube-state-metrics, node-exporter, additional settings are left default
# If you have dedicated storage nodes/tolerations you can add nodeSelector/tolerations for pods here.
