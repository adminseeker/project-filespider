apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: project-filespider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      serviceAccountName: sc-k8s-sa
      containers:
        - name: authservice
          image: ghcr.io/adminseeker/filespider-authservice:latest
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          ports:
          - containerPort: 8081
      imagePullSecrets:
        - name:  container-registry-secret

