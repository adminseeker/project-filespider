management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin-service.logging.svc.cluster.local:9411/api/v2/spans


