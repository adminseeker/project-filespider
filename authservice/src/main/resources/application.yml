spring:
    application:
        name: authservice
    profiles:
        active: default
    cloud:
      kubernetes:
        discovery:
          namespaces:
              - project-filespider
          enabled: true
    rabbitmq:
      host: rabbitmq-cluster.logging.svc.cluster.local
      port: 5672
      username: rabbitmq-user
      password: rabbitmq-user
        

server:
    port: 8081

